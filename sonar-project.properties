# Read by the sonar-scanner CLI. No workflow in .github/workflows currently runs
# it — SonarCloud analyses this repo through Automatic Analysis, which reads
# `.sonarcloud.properties` instead. Keep the exclusions below in sync with that
# file; this one is what takes effect if a scanner step is ever added.
sonar.projectKey=silverlogic_baseapp-frontend
sonar.organization=silverlogic
sonar.exclusions=**/__tests__/**,**/__generated__/**,**/*.test.ts,**/*.test.tsx,**/__storybook__/**,**/.storybook/**
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/__storybook__/**,**/.storybook/**
