# Scanner waivers. Each rule is scoped to the package it applies to via `purls`
# and carries an expiry so it gets re-examined instead of living forever.
# Consumed explicitly via `--ignorefile` in .github/workflows/main.yml.
vulnerabilities:
  # No patched release exists. Both advisories (GHSA-5p2g-fcmc-qvqq,
  # GHSA-w3rx-r6r6-pgpr) list every published version as vulnerable, including
  # the 2.x line, so there is no version to upgrade to. image-size reaches us
  # only through metro, the React Native bundler: it runs on a developer machine
  # or in CI to read asset dimensions while producing a bundle, and is not part
  # of the shipped app. Triggering the DoS requires feeding the bundler a
  # hostile image, which means committing one to our own assets.
  - id: CVE-2025-71329
    purls:
      - "pkg:npm/image-size"
    expired_at: 2026-11-11
    statement: >-
      No patched version exists in any release line. Reached only through metro
      (build-time bundler), not shipped in the app bundle.
  - id: CVE-2025-71330
    purls:
      - "pkg:npm/image-size"
    expired_at: 2026-11-11
    statement: >-
      No patched version exists in any release line. Reached only through metro
      (build-time bundler), not shipped in the app bundle.
  # No patched release exists. GHSA-86w9-cpqp-85rv lists node-forge <= 1.4.0 as
  # vulnerable and 1.4.0 is the latest published version. node-forge reaches us
  # only through dev tooling: @expo/cli (via @expo/code-signing-certificates, for
  # dev-server manifest signing) and webpack-dev-server (via selfsigned, to
  # generate a local HTTPS cert). Neither runs in a shipped bundle or verifies
  # untrusted signatures in production.
  - id: CVE-2026-85393
    purls:
      - "pkg:npm/node-forge"
    expired_at: 2026-12-31
    statement: >-
      No patched version exists. Reached only through dev tooling (@expo/cli,
      webpack-dev-server), not shipped in any app bundle.
  # No patched release exists. GHSA-vfj7-8cjw-p6xm lists braces <= 3.0.3 as
  # vulnerable and 3.0.3 is the latest published version. braces reaches us only
  # through micromatch and chokidar, which sit under build/dev tooling: metro's
  # file map, jest, fast-glob, tailwindcss and webpack-dev-server. Those expand
  # glob patterns taken from our own config files, so triggering the stack
  # overflow means committing a deeply nested pattern ourselves; none of it runs
  # in a shipped bundle.
  - id: CVE-2026-93687
    purls:
      - "pkg:npm/braces"
    expired_at: 2026-11-11
    statement: >-
      No patched version exists. Reached only through build/dev tooling
      (micromatch, chokidar), which expands patterns from our own config and is
      not shipped in any app bundle.
  # The fix is glob 14.0.2, a new major that changes the walker API (arrays in
  # place of sets, renamed Pattern methods) and moves to minimatch 11. glob 13
  # reaches us only through Expo's build tooling: @expo/cli, @expo/config,
  # @expo/config-plugins, @expo/fingerprint and @expo/metro-config, which walk
  # our own project files. The bypass needs a caller that aborts a walk through
  # an AbortSignal on attacker-controlled input; none of that runs in a shipped
  # bundle. Overriding to 14 under Expo would risk breaking the native build, so
  # this waits for Expo to move to glob 14.
  - id: CVE-2026-118773
    purls:
      - "pkg:npm/glob"
    expired_at: 2026-12-31
    statement: >-
      Fixed only in glob 14 (breaking API). Reached only through Expo build
      tooling walking our own files, not shipped in any app bundle.
  # The fix is minimatch 11.0.1, a new major that removes makeRe(), the AST class
  # and other APIs. The amplification needs optimizationLevel >= 2 and an
  # attacker-supplied pattern. minimatch 3.x (eslint 8, its plugins, glob 7,
  # test-exclude, fork-ts-checker-webpack-plugin) has no optimizationLevel
  # option at all; minimatch 10.x reaches us through glob 13 and
  # @expo/fingerprint. Every caller is lint, test or build tooling matching
  # patterns from our own config, and none of it runs in a shipped bundle.
  - id: CVE-2026-118764
    purls:
      - "pkg:npm/minimatch"
    expired_at: 2026-12-31
    statement: >-
      Fixed only in minimatch 11 (breaking API). Needs optimizationLevel >= 2
      and an attacker-supplied pattern; reached only through lint, test and
      build tooling, not shipped in any app bundle.
