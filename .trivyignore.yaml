# Dated package waivers adopted from approved upstream policy e7197aa2/40cb0cba.
# image-size is fixed by version 2.0.4 and no longer waived.
vulnerabilities:
  # No patched release exists. GHSA-86w9-cpqp-85rv lists node-forge <= 1.4.0 as
  # vulnerable and 1.4.0 is the latest published version. node-forge reaches us
  # only through dev tooling: @expo/cli (via @expo/code-signing-certificates, for
  # dev-server manifest signing). The upgraded selfsigned/Cypress chain no
  # longer includes node-forge. This tool never runs in a shipped bundle or verifies
  # untrusted signatures in production.
  - id: CVE-2026-85393
    purls:
      - "pkg:npm/node-forge"
    expired_at: 2026-12-31
    statement: >-
      No patched version exists. Reached only through dev tooling (@expo/cli,
      dev-server signing), not shipped in any app bundle.
  # No patched release exists. GHSA-vfj7-8cjw-p6xm lists braces <= 3.0.3 as
  # vulnerable and 3.0.3 is the latest published version. braces reaches us only
  # through micromatch and chokidar, which sit under build/dev tooling: metro's
  # file map, jest, fast-glob, tailwindcss and webpack-dev-server. Those expand
  # glob patterns taken from our own config files, so triggering the stack
  # overflow means committing a deeply nested pattern ourselves; none of it runs
  # in a shipped bundle.
  - id: CVE-2026-93687
    purls:
      - "pkg:npm/braces"
    expired_at: 2026-11-11
    statement: >-
      No patched version exists. Reached only through build/dev tooling
      (micromatch, chokidar), which expands patterns from our own config and is
      not shipped in any app bundle.
