id: next-no-img-element
language: Tsx
severity: error
message: "Use `next/image` instead of a raw `<img>` — it handles format conversion, resizing, lazy loading, and layout-shift prevention. See .claude/skills/frontend-conventions/references/image-optimization.md"
# The guideline is scoped to the web app. The design-system packages render
# `<img>` for object-URL previews, which Next.js cannot optimize anyway.
files:
  - "apps/web/**"
rule:
  any:
    - kind: jsx_opening_element
      has:
        field: name
        regex: ^img$
    - kind: jsx_self_closing_element
      has:
        field: name
        regex: ^img$
