id: ts-no-enum
language: Tsx
severity: warning
message: "Do not use TypeScript enums — they emit a runtime object, use nominal typing, and numeric variants bypass type safety. Use an `as const` object plus `ValueOf<typeof X>`, or a plain union type. See .claude/skills/frontend-conventions/references/typescript.md"
ignores:
  - "**/__generated__/**"
  - "**/node_modules/**"
rule:
  kind: enum_declaration
