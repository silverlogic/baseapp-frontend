id: next-image-no-custom-loader
language: Tsx
severity: warning
message: "A per-image `loader` hands URL generation to your own code, so Next.js stops optimizing this image (no format conversion, quality, or resizing). Allow the host under `images.remotePatterns` in `next.config.js` and let the built-in optimizer handle it. If a third-party optimizer is genuinely required, configure it once via `images.loaderFile` rather than per `<Image>`. See .claude/skills/frontend-conventions/references/image-optimization.md"
rule:
  kind: jsx_attribute
  regex: ^loader=
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ^Image$
