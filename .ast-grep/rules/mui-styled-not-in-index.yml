id: mui-styled-not-in-index
language: Tsx
severity: warning
message: "Styled components belong in a sibling `styled.tsx`, not in `index.tsx`. See .claude/skills/frontend-conventions/references/styling.md"
files:
  - "**/index.tsx"
rule:
  kind: call_expression
  has:
    field: function
    regex: ^styled$
