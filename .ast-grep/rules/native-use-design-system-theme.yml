id: native-use-design-system-theme
language: Tsx
severity: warning
message: "In native code `useTheme` must come from `@baseapp-frontend/design-system/providers/native` — it handles light/dark color-mode switching and maps to the BaseApp tokens. See .claude/skills/frontend-conventions/references/styling.md"
files:
  - "apps/mobile/**"
  - "**/native/**"
rule:
  kind: import_statement
  all:
    - has:
        stopBy: end
        kind: import_specifier
        has:
          field: name
          regex: ^useTheme$
    # the package specifier, or a relative path — the design-system package reaches
    # its own provider relatively. Any other package is what this rule is for.
    - not:
        has:
          field: source
          regex: "^['\"](@baseapp-frontend/design-system/providers/native|\\.[^'\"]*providers/native)['\"]$"
