id: next-image-static-public-src
language: Tsx
severity: warning
message: "A string path into `public/` keeps its URL when the file's content changes, so browsers, the CDN and the image optimizer (`minimumCacheTTL`) keep serving the old file after it is replaced. Statically import it (`import logo from 'public/svg/logo.svg'`) and pass the import — or `logo.src` where the prop is typed `string` — so it gets a hashed, immutable `/_next/static/media` URL. See .claude/skills/frontend-conventions/references/image-optimization.md"
rule:
  kind: jsx_attribute
  # A root-relative path (a public/ file); protocol-relative `//host/...` URLs are remote.
  regex: ^src=["']/[^/]
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ^(Image|ProjectLogo)$
