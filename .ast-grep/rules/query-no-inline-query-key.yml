id: query-no-inline-query-key
language: Tsx
severity: warning
message: "Don't hand-write query keys as loose string arrays. Build them from the service's `*_API_KEY` object (`default` + one entry per method) so invalidation stays precise. See .claude/skills/frontend-patterns/references/rest-data-fetching.md"
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: ^queryKey$
    # a leading string literal means the key was written by hand; a leading spread
    # (`[...ORDER_API_KEY.default, …]`) means it came from the service's key object
    - has:
        field: value
        kind: array
        has:
          any:
            - nthChild: 1
              kind: string
            - nthChild: 1
              kind: template_string
