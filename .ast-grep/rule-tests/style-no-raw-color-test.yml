id: style-no-raw-color
valid:
  - |
    export const Title = styled('h3')(({ theme }) => ({
      color: theme.palette.text.primary,
    }))
  - |
    <Box sx={{ color: 'primary.main', bgcolor: 'background.paper' }}>content</Box>
  - |
    <SvgIcon color="action">{path}</SvgIcon>
  - |
    const anchor = '#section-2'
  - |
    const id = 'abc#def123'
invalid:
  - |
    <path d="M12 11" fill="#637381" />
  - |
    <Box sx={{ color: '#fff' }}>content</Box>
  - |
    export const Card = styled('div')(() => ({
      boxShadow: '0 1px 2px rgba(0, 0, 0, 0.2)',
    }))
  - |
    const accent = 'hsl(210, 40%, 50%)'
  - |
    const border = `1px solid #E0E0E0`
