id: next-no-img-element
snapshots:
  ? |
    <img src="/hero-image.jpg" alt="Hero" />
  : labels:
    - source: <img src="/hero-image.jpg" alt="Hero" />
      style: primary
      start: 0
      end: 40
    - source: img
      style: secondary
      start: 1
      end: 4
  ? |
    <img src={url} alt="External"></img>
  : labels:
    - source: <img src={url} alt="External">
      style: primary
      start: 0
      end: 30
    - source: img
      style: secondary
      start: 1
      end: 4
