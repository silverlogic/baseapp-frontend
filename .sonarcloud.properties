# SonarCloud Automatic Analysis reads THIS file.
#
# `sonar-project.properties` is read by the sonar-scanner CLI, which no workflow
# in .github/workflows runs — so the exclusions declared there have never taken
# effect. The symptom was a PR adding component tests failing the quality gate on
# `new_duplicated_lines_density` with every duplicated line sitting in a
# `__tests__` directory that `sonar-project.properties` already claimed to
# exclude. Keep the two files in sync.

# Specs, generated Relay artifacts and Storybook scaffolding are not product code.
sonar.exclusions=**/__tests__/**,**/__generated__/**,**/*.test.ts,**/*.test.tsx,**/__storybook__/**,**/.storybook/**

# Duplication is expected and acceptable in tests and stories: each spec sets up
# its own mounts, route stubs and fixtures, and collapsing that into shared
# helpers makes a failing test harder to read than the repetition costs. Declared
# separately from `sonar.exclusions` so narrowing that list later cannot silently
# re-arm the duplication gate against test code.
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/__storybook__/**,**/.storybook/**
