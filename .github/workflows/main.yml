name: Main Workflow

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-lint:
    name: Build and Lint Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  test-unit:
    name: Unit Test Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Test
        run: pnpm test:unit

  utils-runner-comparison:
    name: Utils — Jest vs Vitest (comparison)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Both lanes run back-to-back on the same runner so their durations are
      # directly comparable. `if: always()` ensures Vitest still runs (and its
      # timing is captured) even if the Jest lane fails.
      - name: Jest lane (utils)
        run: pnpm --filter @baseapp-frontend/utils test:unit

      - name: Vitest lane (utils)
        if: always()
        run: pnpm --filter @baseapp-frontend/utils test:unit:vitest

  authentication-runner-comparison:
    name: Authentication — Jest vs Vitest (comparison, +coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Component/hook-heavy package (React Testing Library + React Query + Relay),
      # run WITH coverage — the scenario where Vitest's esbuild transform + V8
      # coverage are expected to beat Jest's ts-jest/babel + istanbul.
      - name: Jest lane (authentication, +coverage)
        run: pnpm --filter @baseapp-frontend/authentication test:unit

      - name: Vitest lane (authentication, +coverage)
        if: always()
        run: pnpm --filter @baseapp-frontend/authentication test:unit:vitest

  design-system-runner-comparison:
    name: Design System — Jest vs Vitest (comparison, +coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Small JSX/hook package (2 specs) — right category but tiny, so expect a
      # noisier signal dominated by fixed startup overhead.
      - name: Jest lane (design-system, +coverage)
        run: pnpm --filter @baseapp-frontend/design-system test:unit

      - name: Vitest lane (design-system, +coverage)
        if: always()
        run: pnpm --filter @baseapp-frontend/design-system test:unit:vitest

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to Harbor Registry
        env:
          HARBOR_USER: ${{ secrets.HARBOR_TRIVY_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TRIVY_ROBOT_TOKEN }}
        run: echo "${HARBOR_TOKEN}" | docker login registry.tsl.io -u "${HARBOR_USER}" --password-stdin

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            registry.tsl.io/baseapp-github/trivy:baseapp \
            fs --scanners vuln --pkg-types library \
            --severity CRITICAL,HIGH,MEDIUM --exit-code 1 \
            --format table /workspace

  test-component:
    name: Component Test Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-13.16.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary (components workspace)
        run: |
          pnpm --filter @baseapp-frontend/components exec cypress cache path
          pnpm --filter @baseapp-frontend/components exec cypress cache list || true
          pnpm --filter @baseapp-frontend/components exec cypress install
          pnpm --filter @baseapp-frontend/components exec cypress cache list
        env:
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Cypress binary exists
        run: |
          ls -la ~/.cache/Cypress || true
          ls -la ~/.cache/Cypress/13.16.1/Cypress || true
          test -x ~/.cache/Cypress/13.16.1/Cypress/Cypress

      - name: Component Test
        run: pnpm test:component
