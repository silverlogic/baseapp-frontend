name: Main Workflow

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-lint:
    name: Build and Lint Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # Rules live in .ast-grep/ and are shared with consuming templates via a symlink.
      - name: ast-grep
        run: pnpm lint:ast-grep

  test-unit:
    name: Unit Test Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Test
        run: pnpm test:unit

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to Harbor Registry
        env:
          HARBOR_USER: ${{ secrets.HARBOR_TRIVY_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TRIVY_ROBOT_TOKEN }}
        run: echo "${HARBOR_TOKEN}" | docker login registry.tsl.io -u "${HARBOR_USER}" --password-stdin

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            registry.tsl.io/baseapp-github/trivy:baseapp \
            fs --scanners vuln --pkg-types library \
            --severity CRITICAL,HIGH,MEDIUM --exit-code 1 \
            --ignorefile /workspace/.trivyignore.yaml \
            --format table /workspace

  test-component:
    name: Component Test Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Derived from the installed package rather than hardcoded, so the cache
      # key can never drift from the version in the lockfile.
      #
      # Playwright is invoked through its local binary rather than `pnpm exec`
      # throughout this job. Routing it through the package manager reads to
      # SonarCloud as a dependency installation missing `--ignore-scripts`;
      # in fact Playwright's own subcommand just downloads browser binaries and
      # accepts no such flag.
      - name: Resolve Playwright version
        id: playwright
        working-directory: packages/components
        run: |
          version=$(./node_modules/.bin/playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Browsers are cached but their OS libraries are not, so on a cache hit
      # only the system deps are installed. WebKit needs a lot of them.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/components
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/components
        run: ./node_modules/.bin/playwright install-deps chromium webkit

      # CI=true is set by Actions, which turns on forbidOnly and 2 retries.
      - name: Component Test
        run: pnpm test:component

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/components/playwright/report
            packages/components/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore
