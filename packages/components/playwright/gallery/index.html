<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Component gallery</title>
  </head>
  <body>
    <!--
      Intentionally unstyled, mirroring Cypress's `cypress/support/component-index.html`
      (a bare body with a single mount div). Adding `height: 100%` here changes
      the layout path for components that measure their container — notably
      react-virtuoso lists, which then render every row and fire endReached.
    -->
    <div id="root"></div>
  </body>
</html>
